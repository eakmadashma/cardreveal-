name: CardReveal
options:
  bundleIdPrefix: com.cardreveal
  deploymentTarget:
    iOS: "17.0"
targets:
  CardReveal:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Card Reveal
        NSCameraUsageDescription: Take photos of your card
        NSPhotoLibraryUsageDescription: Choose photos of your card
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardreveal.pocket26
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
